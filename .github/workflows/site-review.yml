name: Site review
on:
  push:
    branches: [site-refresh-audit-nov23]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/audit" lighthouse@12 playwright-core@1.52.0
      - name: Compare the live homepage with this branch
        run: |
          python3 -m http.server 8191 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for url in https://www.getmyih.com/ http://127.0.0.1:8191/Consultants.html; do
            "$RUNNER_TEMP/audit/node_modules/.bin/lighthouse" "$url" --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lhr.json --quiet
            echo "$url" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.categories | to_entries[] | "\(.key) \(.value.score * 100)"' /tmp/lhr.json >> "$GITHUB_STEP_SUMMARY"
          done
