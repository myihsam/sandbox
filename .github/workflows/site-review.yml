name: Site review
on:
  push:
    branches: [site-refresh-audit-nov23]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        version: [live, baseline, branch]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      live: ${{ steps.summary.outputs.live }}
      branch: ${{ steps.summary.outputs.branch }}
      baseline: ${{ steps.summary.outputs.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/audit" lighthouse@12 playwright-core@1.52.0 axe-core@4
      - name: Start the site
        run: |
          if [[ "${{ matrix.version }}" == live ]]; then
            echo 'URL=https://www.getmyih.com/' >> "$GITHUB_ENV"
          else
            folder="$RUNNER_TEMP/marketing-site"
            mkdir -p "$folder"
            revision=HEAD
            if [[ "${{ matrix.version }}" == baseline ]]; then revision=5ec18e4bac961566c69733f0a6b7fcb78a5a5d36; fi
            git archive "$revision" | tar -x -C "$folder"
            cp "$folder/Consultants.html" "$folder/index.html"
            python3 -m http.server 8191 --directory "$folder" --bind 127.0.0.1 > /tmp/server.log 2>&1 &
            echo 'URL=http://127.0.0.1:8191/' >> "$GITHUB_ENV"
          fi
          mkdir review
      - name: Mobile Lighthouse
        run: |
          "$RUNNER_TEMP/audit/node_modules/.bin/lighthouse" "$URL" --chrome-flags="--headless --no-sandbox" --output=json --output-path=review/lighthouse.json --quiet
          scores=$(jq -r '[.categories|.performance,.accessibility,."best-practices",.seo | (.score*100|round|tostring)]|join("/")' review/lighthouse.json)
          echo "SCORES=$scores" >> "$GITHUB_ENV"
          echo "$scores" >> "$GITHUB_STEP_SUMMARY"
      - name: Browser checks at three widths
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/audit/node_modules" node .github/scripts/site-review.cjs "$URL" review
      - name: Report measurements
        id: summary
        if: always()
        run: |
          ui=unavailable
          if test -f review/audit.json; then
            ui=$(jq -r '[.[] | ([.checks[]|select(.pass)]|length|tostring) + "/" + (.checks|length|tostring)] | join(",")' review/audit.json)
            jq -c '.[] | {width,failed:[.checks[]|select(.pass==false)|.label],errors,homepage,workspace}' review/audit.json >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "${{ matrix.version }}=$SCORES UI $ui" >> "$GITHUB_OUTPUT"
          echo "Lighthouse $SCORES" >> "$GITHUB_STEP_SUMMARY"
          if test -f review/lighthouse.json; then jq '{categories: [.categories[] | {id,score}], version:.lighthouseVersion}' review/lighthouse.json > review/metrics.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.version }}-review
          path: |
            review/metrics.json
            review/audit.json
            review/*.png
  results:
    if: always()
    needs: audit
    runs-on: ubuntu-latest
    name: Live ${{ needs.audit.outputs.live }} · Baseline ${{ needs.audit.outputs.baseline }} · Branch ${{ needs.audit.outputs.branch }}
    steps:
      - run: echo "Compare the live and branch reports in the audit artifacts."
